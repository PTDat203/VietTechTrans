<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
  <title id="title">Phase 02 — Chọn Core MT</title>
  <desc id="desc">Bảy bước theo chiều dọc: kiểm tra input, đánh giá candidate, chọn candidate, thích nghi, đánh giá và review, freeze Core, báo cáo cuối.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.subtitle{font-size:15px;fill:#475569}.step{font-size:19px;font-weight:700}.detail{font-size:15px;fill:#334155}.result{font-size:19px;font-weight:700}.box{fill:#f5f9ff;stroke:#3974c9;stroke-width:2}.final{fill:#fff8e8;stroke:#a97416;stroke-width:2}.out{fill:#eef8f1;stroke:#2f7d4e;stroke-width:2}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <text x="52" y="45" class="title">Phase 02 — Chọn Core MT</text>
  <text x="397" y="73" text-anchor="middle" class="subtitle">Mỗi bước tạo evidence trước khi chuyển sang bước tiếp theo.</text>
  <rect x="72" y="105" width="650" height="80" rx="10" class="box"/><text x="397" y="137" text-anchor="middle" class="step">1. Kiểm tra input</text><text x="397" y="163" text-anchor="middle" class="detail">Dataset gate PASS; final test vẫn khóa</text>
  <path d="M397 185V205" class="arrow"/>
  <rect x="72" y="220" width="650" height="80" rx="10" class="box"/><text x="397" y="252" text-anchor="middle" class="step">2. Đánh giá pretrained</text><text x="397" y="278" text-anchor="middle" class="detail">3 model × 2 chiều × 2 tập validation</text>
  <path d="M397 300V320" class="arrow"/>
  <rect x="72" y="335" width="650" height="80" rx="10" class="box"/><text x="397" y="367" text-anchor="middle" class="step">3. Chọn candidate</text><text x="397" y="393" text-anchor="middle" class="detail">Selection record riêng cho EN→VI và VI→EN</text>
  <path d="M397 415V435" class="arrow"/>
  <rect x="72" y="450" width="650" height="80" rx="10" class="box"/><text x="397" y="482" text-anchor="middle" class="step">4. Chuẩn bị thích nghi</text><text x="397" y="508" text-anchor="middle" class="detail">Ghi experiment record trước khi train</text>
  <path d="M397 530V550" class="arrow"/>
  <rect x="72" y="565" width="650" height="80" rx="10" class="box"/><text x="397" y="597" text-anchor="middle" class="step">5. Thích nghi miền IT</text><text x="397" y="623" text-anchor="middle" class="detail">Chỉ dùng IT Train; lưu checkpoint và training record</text>
  <path d="M397 645V665" class="arrow"/>
  <rect x="72" y="680" width="650" height="80" rx="10" class="box"/><text x="397" y="712" text-anchor="middle" class="step">6. Đánh giá và review</text><text x="397" y="738" text-anchor="middle" class="detail">IT/General Validation và review 50 câu đã khóa</text>
  <path d="M397 760V780" class="arrow"/>
  <rect x="72" y="795" width="650" height="80" rx="10" class="final"/><text x="397" y="827" text-anchor="middle" class="step">7. Freeze Core và báo cáo</text><text x="397" y="853" text-anchor="middle" class="detail">Mở final test sau khi Core đã được khóa</text>
  <path d="M397 875V910" class="arrow"/>
  <rect x="72" y="930" width="650" height="80" rx="10" class="out"/><text x="397" y="970" text-anchor="middle" class="result">Core MT và evidence cho Phase 03</text>
</svg>
