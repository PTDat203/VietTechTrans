<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="570" viewBox="0 0 1560 570" role="img" aria-labelledby="title desc">
  <title id="title">Workflow Phase 04</title>
  <desc id="desc">Đưa Student MT đã freeze lên Android và kiểm tra MT chạy cục bộ trên thiết bị trước khi tích hợp giọng nói ở Phase 05.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#475569"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.subtitle{font-size:16px;fill:#475569}.main{font-size:18px;font-weight:700}.task{font-size:14px}.out{font-size:15px;font-weight:700}.label{font-size:13px;fill:#475569}.mainbox{fill:#e8f1fb;stroke:#3974c9;stroke-width:2}.taskbox{fill:#f7faff;stroke:#94a3b8;stroke-width:1.5}.resultbox{fill:#eef8f1;stroke:#2f7d4e;stroke-width:2}.finalbox{fill:#fff8e8;stroke:#a97416;stroke-width:2}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="55" y="48" class="title">Phase 04 — MT chạy offline trên Android</text><text x="55" y="75" class="subtitle">Phase này chỉ kiểm tra Student MT cục bộ. STT và TTS được tích hợp ở Phase 05.</text>
  <rect x="55" y="110" width="270" height="54" rx="8" class="mainbox"/><text x="190" y="144" text-anchor="middle" class="main">1. Nhận Student đã freeze</text><rect x="55" y="190" width="270" height="44" rx="6" class="taskbox"/><text x="190" y="218" text-anchor="middle" class="task">Đọc checkpoint và tokenizer</text><rect x="55" y="246" width="270" height="44" rx="6" class="taskbox"/><text x="190" y="274" text-anchor="middle" class="task">Ghi model hash và quality baseline</text><rect x="55" y="365" width="270" height="58" rx="8" class="resultbox"/><text x="190" y="401" text-anchor="middle" class="out">Input deployment xác định</text><path class="arrow" d="M190 164V180M190 234V242M190 290V355"/>
  <rect x="365" y="110" width="270" height="54" rx="8" class="mainbox"/><text x="500" y="144" text-anchor="middle" class="main">2. Export và kiểm tra</text><rect x="365" y="190" width="270" height="44" rx="6" class="taskbox"/><text x="500" y="218" text-anchor="middle" class="task">Export sang format/runtime Android</text><rect x="365" y="246" width="270" height="44" rx="6" class="taskbox"/><text x="500" y="274" text-anchor="middle" class="task">So output export với checkpoint gốc</text><rect x="365" y="365" width="270" height="58" rx="8" class="resultbox"/><text x="500" y="401" text-anchor="middle" class="out">MT artifact đã kiểm tra</text><path class="arrow" d="M500 164V180M500 234V242M500 290V355"/>
  <rect x="675" y="110" width="270" height="54" rx="8" class="mainbox"/><text x="810" y="144" text-anchor="middle" class="main">3. Đóng gói cục bộ</text><rect x="675" y="190" width="270" height="44" rx="6" class="taskbox"/><text x="810" y="218" text-anchor="middle" class="task">Đặt model, tokenizer, config trong app</text><rect x="675" y="246" width="270" height="44" rx="6" class="taskbox"/><text x="810" y="274" text-anchor="middle" class="task">Xác định runtime và ABI thiết bị</text><rect x="675" y="365" width="270" height="58" rx="8" class="resultbox"/><text x="810" y="401" text-anchor="middle" class="out">Gói MT không cần mạng</text><path class="arrow" d="M810 164V180M810 234V242M810 290V355"/>
  <rect x="985" y="110" width="270" height="54" rx="8" class="mainbox"/><text x="1120" y="144" text-anchor="middle" class="main">4. Chạy trên thiết bị</text><rect x="985" y="190" width="270" height="44" rx="6" class="taskbox"/><text x="1120" y="218" text-anchor="middle" class="task">Dịch EN→VI và VI→EN tại máy</text><rect x="985" y="246" width="270" height="44" rx="6" class="taskbox"/><text x="1120" y="274" text-anchor="middle" class="task">Không dùng API hoặc tải model lúc chạy</text><rect x="985" y="365" width="270" height="58" rx="8" class="resultbox"/><text x="1120" y="401" text-anchor="middle" class="out">MT offline chạy được</text><path class="arrow" d="M1120 164V180M1120 234V242M1120 290V355"/>
  <rect x="1295" y="110" width="210" height="54" rx="8" class="mainbox"/><text x="1400" y="144" text-anchor="middle" class="main">5. Benchmark MT</text><rect x="1295" y="190" width="210" height="44" rx="6" class="taskbox"/><text x="1400" y="218" text-anchor="middle" class="task">Đo tải model, latency, RAM</text><rect x="1295" y="246" width="210" height="44" rx="6" class="taskbox"/><text x="1400" y="274" text-anchor="middle" class="task">Ghi dung lượng app/model</text><rect x="1295" y="365" width="210" height="58" rx="8" class="finalbox"/><text x="1400" y="401" text-anchor="middle" class="out">MT offline cho Phase 05</text><path class="arrow" d="M1400 164V180M1400 234V242M1400 290V355"/>
  <path class="arrow" d="M325 394H355V137H360M635 394H665V137H670M945 394H975V137H980M1255 394H1285V137H1290"/><text x="345" y="465" text-anchor="middle" class="label">artifact</text><text x="655" y="465" text-anchor="middle" class="label">runtime</text><text x="965" y="465" text-anchor="middle" class="label">gói cục bộ</text><text x="1275" y="465" text-anchor="middle" class="label">benchmark</text>
</svg>
