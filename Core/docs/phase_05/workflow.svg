<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="570" viewBox="0 0 1860 570" role="img" aria-labelledby="title desc">
  <title id="title">Workflow Phase 05</title>
  <desc id="desc">Tích hợp STT, MT và TTS cục bộ thành ứng dụng Android chạy hoàn toàn offline cho hai chiều Anh-Việt.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#475569"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.subtitle{font-size:16px;fill:#475569}.main{font-size:17px;font-weight:700}.task{font-size:13px}.out{font-size:14px;font-weight:700}.label{font-size:12px;fill:#475569}.mainbox{fill:#e8f1fb;stroke:#3974c9;stroke-width:2}.taskbox{fill:#f7faff;stroke:#94a3b8;stroke-width:1.5}.resultbox{fill:#eef8f1;stroke:#2f7d4e;stroke-width:2}.finalbox{fill:#fff8e8;stroke:#a97416;stroke-width:2}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="55" y="48" class="title">Phase 05 — Ứng dụng STT → MT → TTS offline</text><text x="55" y="75" class="subtitle">Mỗi thành phần phải chạy cục bộ. Không dùng system service hoặc API nếu không chứng minh được offline.</text>
  <rect x="55" y="110" width="250" height="54" rx="8" class="mainbox"/><text x="180" y="144" text-anchor="middle" class="main">1. Nhận MT offline</text><rect x="55" y="190" width="250" height="44" rx="6" class="taskbox"/><text x="180" y="218" text-anchor="middle" class="task">Dùng gói MT từ Phase 04</text><rect x="55" y="246" width="250" height="44" rx="6" class="taskbox"/><text x="180" y="274" text-anchor="middle" class="task">Giữ model và runtime đã benchmark</text><rect x="55" y="365" width="250" height="58" rx="8" class="resultbox"/><text x="180" y="401" text-anchor="middle" class="out">MT cục bộ sẵn sàng</text><path class="arrow" d="M180 164V180M180 234V242M180 290V355"/>
  <rect x="340" y="110" width="250" height="54" rx="8" class="mainbox"/><text x="465" y="144" text-anchor="middle" class="main">2. Chọn STT/TTS local</text><rect x="340" y="190" width="250" height="44" rx="6" class="taskbox"/><text x="465" y="218" text-anchor="middle" class="task">Có EN và VI, Android, license rõ</text><rect x="340" y="246" width="250" height="44" rx="6" class="taskbox"/><text x="465" y="274" text-anchor="middle" class="task">Model không cần network khi chạy</text><rect x="340" y="365" width="250" height="58" rx="8" class="resultbox"/><text x="465" y="401" text-anchor="middle" class="out">STT/TTS local đã freeze</text><path class="arrow" d="M465 164V180M465 234V242M465 290V355"/>
  <rect x="625" y="110" width="250" height="54" rx="8" class="mainbox"/><text x="750" y="144" text-anchor="middle" class="main">3. Đóng gói app offline</text><rect x="625" y="190" width="250" height="44" rx="6" class="taskbox"/><text x="750" y="218" text-anchor="middle" class="task">Đưa STT, MT, TTS và asset vào app</text><rect x="625" y="246" width="250" height="44" rx="6" class="taskbox"/><text x="750" y="274" text-anchor="middle" class="task">Không tải model trong lần chạy đầu</text><rect x="625" y="365" width="250" height="58" rx="8" class="resultbox"/><text x="750" y="401" text-anchor="middle" class="out">APK có đủ asset local</text><path class="arrow" d="M750 164V180M750 234V242M750 290V355"/>
  <rect x="910" y="110" width="250" height="54" rx="8" class="mainbox"/><text x="1035" y="144" text-anchor="middle" class="main">4. Tích hợp luồng</text><rect x="910" y="190" width="250" height="44" rx="6" class="taskbox"/><text x="1035" y="218" text-anchor="middle" class="task">Chọn chiều và ngôn ngữ đầu vào rõ</text><rect x="910" y="246" width="250" height="44" rx="6" class="taskbox"/><text x="1035" y="274" text-anchor="middle" class="task">Audio → STT → MT → TTS → audio</text><rect x="910" y="365" width="250" height="58" rx="8" class="resultbox"/><text x="1035" y="401" text-anchor="middle" class="out">Luồng hai chiều hoạt động</text><path class="arrow" d="M1035 164V180M1035 234V242M1035 290V355"/>
  <rect x="1195" y="110" width="250" height="54" rx="8" class="mainbox"/><text x="1320" y="144" text-anchor="middle" class="main">5. Test Airplane mode</text><rect x="1195" y="190" width="250" height="44" rx="6" class="taskbox"/><text x="1320" y="218" text-anchor="middle" class="task">Tắt Wi-Fi và mobile data</text><rect x="1195" y="246" width="250" height="44" rx="6" class="taskbox"/><text x="1320" y="274" text-anchor="middle" class="task">Test EN→VI và VI→EN trên máy thật</text><rect x="1195" y="365" width="250" height="58" rx="8" class="resultbox"/><text x="1320" y="401" text-anchor="middle" class="out">Offline end-to-end PASS</text><path class="arrow" d="M1320 164V180M1320 234V242M1320 290V355"/>
  <rect x="1480" y="110" width="250" height="54" rx="8" class="mainbox"/><text x="1605" y="144" text-anchor="middle" class="main">6. Báo cáo ứng dụng</text><rect x="1480" y="190" width="250" height="44" rx="6" class="taskbox"/><text x="1605" y="218" text-anchor="middle" class="task">Ghi thời gian STT, MT, TTS, tổng</text><rect x="1480" y="246" width="250" height="44" rx="6" class="taskbox"/><text x="1605" y="274" text-anchor="middle" class="task">Ghi thiết bị, APK và model version</text><rect x="1480" y="365" width="250" height="58" rx="8" class="finalbox"/><text x="1605" y="396" text-anchor="middle" class="out">Ứng dụng offline</text><text x="1605" y="416" text-anchor="middle" class="out">có evidence</text><path class="arrow" d="M1605 164V180M1605 234V242M1605 290V355"/>
  <path class="arrow" d="M305 394H330V137H335M590 394H615V137H620M875 394H900V137H905M1160 394H1185V137H1190M1445 394H1470V137H1475"/><text x="318" y="465" text-anchor="middle" class="label">MT</text><text x="603" y="465" text-anchor="middle" class="label">voice models</text><text x="888" y="465" text-anchor="middle" class="label">offline assets</text><text x="1173" y="465" text-anchor="middle" class="label">app flow</text><text x="1458" y="465" text-anchor="middle" class="label">offline proof</text>
</svg>
