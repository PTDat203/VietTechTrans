<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
  <title id="title">VietTechTrans Core — Phase 01 đến Phase 03</title>
  <desc id="desc">Luồng Core theo chiều dọc: dataset đã khóa, Core MT đã freeze, Student Main-Core và gói bàn giao sang máy Phase 4 khác.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.subtitle{font-size:15px;fill:#475569}.phase{font-size:21px;font-weight:700}.detail{font-size:16px;fill:#334155}.out{font-size:18px;font-weight:700}.box{fill:#f5f9ff;stroke:#3974c9;stroke-width:2}.result{fill:#eef8f1;stroke:#2f7d4e;stroke-width:2}.handoff{fill:#fff8e8;stroke:#a97416;stroke-width:2}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <text x="52" y="45" class="title">VietTechTrans Core — Phase 01 đến Phase 03</text>
  <text x="397" y="73" text-anchor="middle" class="subtitle">Repository chỉ lưu phần nghiên cứu và evidence Core.</text>
  <rect x="72" y="120" width="650" height="150" rx="12" class="box"/><text x="397" y="158" text-anchor="middle" class="phase">Phase 01 — Dataset IT EN↔VI</text><text x="397" y="193" text-anchor="middle" class="detail">RAW → audit → cleaning → phân nhóm → split</text><text x="397" y="220" text-anchor="middle" class="detail">manifest, checksum, leakage gate</text><text x="397" y="250" text-anchor="middle" class="out">Kết quả: release `it_en_vi` đã khóa</text>
  <path d="M397 270V325" class="arrow"/>
  <rect x="72" y="345" width="650" height="150" rx="12" class="box"/><text x="397" y="383" text-anchor="middle" class="phase">Phase 02 — Chọn Core MT</text><text x="397" y="418" text-anchor="middle" class="detail">screening → selection → LoRA adaptation</text><text x="397" y="445" text-anchor="middle" class="detail">validation, review 50 câu, final reporting</text><text x="397" y="475" text-anchor="middle" class="out">Kết quả: Core EN→VI và VI→EN đã freeze</text>
  <path d="M397 495V550" class="arrow"/>
  <rect x="72" y="570" width="650" height="150" rx="12" class="box"/><text x="397" y="608" text-anchor="middle" class="phase">Phase 03 — Student Main-Core</text><text x="397" y="643" text-anchor="middle" class="detail">Teacher target → integrity → train Student</text><text x="397" y="670" text-anchor="middle" class="detail">validation, review 50 câu, decision</text><text x="397" y="700" text-anchor="middle" class="out">Kết quả: Student Main-Core hai chiều đã freeze</text>
  <path d="M397 720V775" class="arrow"/>
  <rect x="72" y="795" width="650" height="120" rx="12" class="handoff"/><text x="397" y="837" text-anchor="middle" class="phase">Bàn giao cho máy Phase 4 khác</text><text x="397" y="870" text-anchor="middle" class="detail">Checkpoint + SHA-256 tree + Main-Core decision</text><text x="397" y="897" text-anchor="middle" class="detail">Không có mã app hay artifact Phase 4 trong Core</text>
</svg>
