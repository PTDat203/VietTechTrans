name: envi-it-mt-phase2
channels:
  - conda-forge
  - defaults
dependencies:
  # Python 3.11.15 is the version verified in the existing local environment.
  # Python 3.14's _socket DLL is blocked by this machine's Application Control.
  - python=3.11.15
  - pip
  - jupyterlab=4.5.9
      - ipykernel=6.31.0
      - nbformat=5.10.4
      - nbconvert=7.17.1
      - matplotlib=3.11.0
  - pip:
      # Baseline dependencies. The completed Phase 02 GPU runtime is recorded
      # separately in docs/environment.md and its evidence files.
      - datasets==5.0.1
      - pandas==3.0.5
      - httpx==0.28.1
      - mtdata==0.4.3
      - pyarrow==25.0.1
      # Phase 02 — teacher candidates and IT adaptation.
      - transformers==4.57.6
      - accelerate==1.14.0
      - peft==0.18.1
      - tokenizers==0.22.1
      - torch==2.14.0
      - huggingface_hub==0.36.2
      - sacrebleu==2.6.0
      - sentencepiece==0.2.2
