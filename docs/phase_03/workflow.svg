<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="570" viewBox="0 0 1560 570" role="img" aria-labelledby="title desc">
  <title id="title">Workflow Phase 03</title>
  <desc id="desc">Tạo Student MT từ Core đã freeze, đánh giá Student trên validation và chuyển checkpoint Student đã chọn sang Phase 04.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#475569"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.subtitle{font-size:16px;fill:#475569}.main{font-size:18px;font-weight:700}.task{font-size:14px}.out{font-size:15px;font-weight:700}.label{font-size:13px;fill:#475569}.mainbox{fill:#e8f1fb;stroke:#3974c9;stroke-width:2}.taskbox{fill:#f7faff;stroke:#94a3b8;stroke-width:1.5}.resultbox{fill:#eef8f1;stroke:#2f7d4e;stroke-width:2}.finalbox{fill:#fff8e8;stroke:#a97416;stroke-width:2}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="55" y="48" class="title">Phase 03 — Tạo Student MT</text><text x="55" y="75" class="subtitle">Core MT đã freeze ở Phase 02 là nguồn tri thức. Validation/Test không dùng để tạo dữ liệu học.</text>
  <rect x="55" y="110" width="270" height="54" rx="8" class="mainbox"/><text x="190" y="144" text-anchor="middle" class="main">1. Nhận Core đã freeze</text><rect x="55" y="190" width="270" height="44" rx="6" class="taskbox"/><text x="190" y="218" text-anchor="middle" class="task">Đọc Core/checkpoint cho từng chiều</text><rect x="55" y="246" width="270" height="44" rx="6" class="taskbox"/><text x="190" y="274" text-anchor="middle" class="task">Ghi revision và generation config</text><rect x="55" y="365" width="270" height="58" rx="8" class="resultbox"/><text x="190" y="401" text-anchor="middle" class="out">Teacher đã xác định</text><path class="arrow" d="M190 164V180M190 234V242M190 290V355"/>
  <rect x="365" y="110" width="270" height="54" rx="8" class="mainbox"/><text x="500" y="144" text-anchor="middle" class="main">2. Lập protocol Student</text><rect x="365" y="190" width="270" height="44" rx="6" class="taskbox"/><text x="500" y="218" text-anchor="middle" class="task">Chọn cấu hình Student có căn cứ</text><rect x="365" y="246" width="270" height="44" rx="6" class="taskbox"/><text x="500" y="274" text-anchor="middle" class="task">Ghi dữ liệu, seed, checkpoint, metric</text><rect x="365" y="365" width="270" height="58" rx="8" class="resultbox"/><text x="500" y="401" text-anchor="middle" class="out">Protocol trước train</text><path class="arrow" d="M500 164V180M500 234V242M500 290V355"/>
  <rect x="675" y="110" width="270" height="54" rx="8" class="mainbox"/><text x="810" y="144" text-anchor="middle" class="main">3. Distillation</text><rect x="675" y="190" width="270" height="44" rx="6" class="taskbox"/><text x="810" y="218" text-anchor="middle" class="task">Chỉ dùng nguồn từ IT Train</text><rect x="675" y="246" width="270" height="44" rx="6" class="taskbox"/><text x="810" y="274" text-anchor="middle" class="task">Teacher tạo tín hiệu cho Student</text><rect x="675" y="365" width="270" height="58" rx="8" class="resultbox"/><text x="810" y="401" text-anchor="middle" class="out">Checkpoint Student</text><path class="arrow" d="M810 164V180M810 234V242M810 290V355"/>
  <rect x="985" y="110" width="270" height="54" rx="8" class="mainbox"/><text x="1120" y="144" text-anchor="middle" class="main">4. Đánh giá Student</text><rect x="985" y="190" width="270" height="44" rx="6" class="taskbox"/><text x="1120" y="218" text-anchor="middle" class="task">Chạy IT và General Validation</text><rect x="985" y="246" width="270" height="44" rx="6" class="taskbox"/><text x="1120" y="274" text-anchor="middle" class="task">So với Core theo metric đã ghi</text><rect x="985" y="365" width="270" height="58" rx="8" class="resultbox"/><text x="1120" y="401" text-anchor="middle" class="out">Evidence chất lượng Student</text><path class="arrow" d="M1120 164V180M1120 234V242M1120 290V355"/>
  <rect x="1295" y="110" width="210" height="54" rx="8" class="mainbox"/><text x="1400" y="144" text-anchor="middle" class="main">5. Freeze Student</text><rect x="1295" y="190" width="210" height="44" rx="6" class="taskbox"/><text x="1400" y="218" text-anchor="middle" class="task">Ghi checkpoint được giữ</text><rect x="1295" y="246" width="210" height="44" rx="6" class="taskbox"/><text x="1400" y="274" text-anchor="middle" class="task">Lưu config và provenance</text><rect x="1295" y="365" width="210" height="58" rx="8" class="finalbox"/><text x="1400" y="401" text-anchor="middle" class="out">Student cho Phase 04</text><path class="arrow" d="M1400 164V180M1400 234V242M1400 290V355"/>
  <path class="arrow" d="M325 394H355V137H360M635 394H665V137H670M945 394H975V137H980M1255 394H1285V137H1290"/><text x="345" y="465" text-anchor="middle" class="label">teacher</text><text x="655" y="465" text-anchor="middle" class="label">protocol</text><text x="965" y="465" text-anchor="middle" class="label">student</text><text x="1275" y="465" text-anchor="middle" class="label">evidence</text>
</svg>
